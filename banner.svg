<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" role="img" aria-label="Экосистема «Классик» — все справочники">
  <style>
    .logo-bg{fill:#e8f0f7} .logo-ink{stroke:#16263f} .logo-dot{fill:#ffffff}
    .ink{fill:#16263f} .muted{fill:#5b6b7f} .hint{fill:#2563eb}
    .m{display:none}
    @media (prefers-color-scheme: dark){
      .logo-bg{fill:#1e293b} .logo-ink{stroke:#e6edf7} .logo-dot{fill:#0b1120}
      .ink{fill:#e6edf7} .muted{fill:#94a3b8} .hint{fill:#60a5fa}
    }
    /* Узкий экран (мобил/планшет): переключаемся на крупную раскладку.
       Порог 700px = ширина img, а не окна [[10]][[24]][[25]]. */
    @media (max-width: 700px){
      .d{display:none} .m{display:inline}
    }
  </style>

  <!-- ===== ДЕСКТОПНАЯ РАСКЛАДКА (class d) ===== -->
  <g class="d">
    <g transform="translate(20 40) scale(0.625)">
      <circle cx="32" cy="32" r="32" class="logo-bg"/>
      <g fill="none" class="logo-ink" stroke-width="10" stroke-linecap="butt">
        <path d="M17 14 V50"/><path d="M22 32 L41 13"/><path d="M22 32 L46 50"/>
      </g>
      <circle cx="44" cy="23" r="10" class="logo-dot"/>
      <circle cx="44" cy="23" r="10" fill="none" class="logo-ink" stroke-width="3.5"/>
      <path d="M51 30 L57.5 36.5" fill="none" class="logo-ink" stroke-width="5" stroke-linecap="round"/>
      <g fill="none" class="logo-ink" stroke-width="2.2" stroke-linecap="round">
        <path d="M39 19 q2.5 -2 5 0 t5 0"/><path d="M38.5 23 q2.5 -2 5.5 0 t5.5 0"/><path d="M39 27 q2.5 -2 5 0 t5 0"/>
      </g>
    </g>
    <text x="72" y="61" class="ink" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="20" font-weight="700" letter-spacing="-0.3">Классик</text>
    <text x="72" y="79" class="muted" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="12">Справочники и открытые данные</text>
    <text x="1180" y="67" text-anchor="end" class="hint" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="13" font-weight="600">← Все справочники</text>
  </g>

  <!-- ===== МОБИЛЬНАЯ РАСКЛАДКА (class m, крупная) ===== -->
  <g class="m">
    <g transform="translate(24 8) scale(1.55)">
      <circle cx="32" cy="32" r="32" class="logo-bg"/>
      <g fill="none" class="logo-ink" stroke-width="10" stroke-linecap="butt">
        <path d="M17 14 V50"/><path d="M22 32 L41 13"/><path d="M22 32 L46 50"/>
      </g>
      <circle cx="44" cy="23" r="10" class="logo-dot"/>
      <circle cx="44" cy="23" r="10" fill="none" class="logo-ink" stroke-width="3.5"/>
      <path d="M51 30 L57.5 36.5" fill="none" class="logo-ink" stroke-width="5" stroke-linecap="round"/>
      <g fill="none" class="logo-ink" stroke-width="2.2" stroke-linecap="round">
        <path d="M39 19 q2.5 -2 5 0 t5 0"/><path d="M38.5 23 q2.5 -2 5.5 0 t5.5 0"/><path d="M39 27 q2.5 -2 5 0 t5 0"/>
      </g>
    </g>
    <text x="140" y="78" class="ink" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif" font-size="60" font-weight="700" letter-spacing="-0.8">Классик</text>
  </g>
</svg>
