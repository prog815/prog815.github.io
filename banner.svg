<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" role="img" aria-label="Экосистема «Классик» — все справочники">
  <style>
    .bg-circle { fill: #e8f0f7; }
    .text-main { fill: #16263f; }
    .text-sub { fill: #5b6b7f; }
    .stroke-main { stroke: #16263f; }
    .hint-text { fill: #2563eb; }
    
    @media (prefers-color-scheme: dark) {
      .bg-circle { fill: #1e293b; }
      .text-main { fill: #e6edf7; }
      .text-sub { fill: #94a3b8; }
      .stroke-main { stroke: #e6edf7; }
      .hint-text { fill: #60a5fa; }
    }
  </style>

  <!-- Логотип: сдвиг по Y на +28px для центрирования в новой высоте 120px (было 12, стало 40) -->
  <g transform="translate(20 40) scale(0.625)">
    <circle cx="32" cy="32" r="32" class="bg-circle"/>
    <g fill="none" class="stroke-main" stroke-width="10" stroke-linecap="butt">
      <path d="M17 14 V50"/>
      <path d="M22 32 L41 13"/>
      <path d="M22 32 L46 50"/>
    </g>
    <circle cx="44" cy="23" r="10" fill="#ffffff"/>
    <circle cx="44" cy="23" r="10" fill="none" class="stroke-main" stroke-width="3.5"/>
    <path d="M51 30 L57.5 36.5" fill="none" class="stroke-main" stroke-width="5" stroke-linecap="round"/>
    <g fill="none" class="stroke-main" stroke-width="2.2" stroke-linecap="round">
      <path d="M39 19 q2.5 -2 5 0 t5 0"/>
      <path d="M38.5 23 q2.5 -2 5.5 0 t5.5 0"/>
      <path d="M39 27 q2.5 -2 5 0 t5 0"/>
    </g>
  </g>

  <!-- Вордмарк: сдвиг по Y на +28px (было 33, стало 61) -->
  <text x="72" y="61" class="text-main"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif"
        font-size="20" font-weight="700" letter-spacing="-0.3">Классик</text>

  <!-- Подзаголовок: сдвиг по Y на +28px (было 51, стало 79) -->
  <text x="72" y="79" class="text-sub"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif"
        font-size="12">Справочники и открытые данные</text>

  <!-- Правая подсказка: сдвиг по Y на +28px (было 39, стало 67) -->
  <text x="1180" y="67" text-anchor="end" class="hint-text"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif"
        font-size="13" font-weight="600">← Все справочники</text>
</svg>
